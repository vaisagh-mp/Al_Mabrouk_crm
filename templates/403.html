{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden - Blessed Marine Services CRM</title>
    <link rel="icon" type="image/png" href="{% static 'assets/images/pwa-logo.png' %}" />
    <link rel="stylesheet" href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}?v=20261111">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .error-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }
        .error-icon {
            font-size: 54px;
            color: #dc3545;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        .error-message {
            font-size: 15px;
            color: #6c757d;
            margin-bottom: 28px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1 class="error-title">Access Denied</h1>
        <p class="error-message">You don't have permission to view this page.</p>
        <button type="button" class="fin-btn" onclick="history.back()">
            <i class="fas fa-arrow-left"></i> Go back
        </button>
    </div>
</body>
</html>
